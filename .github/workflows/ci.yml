---
name: CI

on:
  push:
    branches: [main, master, default]
  pull_request:
    branches: [main, master, default]
  schedule:
    # Weekly on Sundays to catch upstream breakage
    - cron: "0 3 * * 0" 
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown-Lint
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install markdownlint
        run: |
          sudo npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint .
  shellcheck:
    name: ShellCheck
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -exec shellcheck {} \;

  ci-pass:
    name: CI Pass
    runs-on: [self-hosted, linux, x64]
    needs: [markdownlint, shellcheck]
    steps:
      - name: Check Results
        run: |
          if [[ "${{ needs.markdownlint.result }}" != 'success' ]] || \
          [[ "${{ needs.shellcheck.result }}" != 'success' ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          echo "All checks passed successfully!"
